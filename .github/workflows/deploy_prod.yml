name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Target di deploy'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - default
          - camminiditalia

permissions:
  contents: write
  pull-requests: write

jobs:
  run-tests:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build:
    needs: run-tests
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Ionic CLI
        run: npm install -g @ionic/cli@7.2.1

      - name: Install dependencies
        run: npm ci

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Setup SSH config
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << EOF
          Host server
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port ${{ secrets.SSH_PORT }}
            StrictHostKeyChecking no
          EOF

      - name: Create posthog.json
        run: |
          mkdir -p src/app/config
          echo '{ "POSTHOG_KEY": "${{ secrets.POSTHOG_KEY }}", "POSTHOG_HOST": "${{ secrets.POSTHOG_HOST }}" }' > src/app/config/posthog.json

      - name: Extract --target from commit message
        run: |
          COMMIT_MSG=$(git show -s --format=%B ${{ github.sha }})
          TARGET=$(echo "$COMMIT_MSG" | grep -oP '(?<=--target )(all|default|camminiditalia)' | head -1) || true
          TARGET=${TARGET:-all}
          echo "COMMIT_TARGET=$TARGET" >> $GITHUB_ENV

      - name: Deploy
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          RSYNC_RSH: sshpass -e ssh
        run: |
          TARGET="${{ github.event.inputs.target || env.COMMIT_TARGET }}"
          if [ "$TARGET" = "default" ]; then
            npm run deploy-default
          elif [ "$TARGET" = "camminiditalia" ]; then
            npm run deploy-camminiditalia
          else
            npm run deploy
          fi
